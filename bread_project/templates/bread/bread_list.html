{% extends "base.html" %}
{% load static %}
{% block content %}
    <div class="grid">
        {% for bread in breads %}
            <a href="{% url 'bread:bread_detail' forloop.counter %}"
               class="card-link">
                <div class="card">
                    <div class="card-inner">
                        <div class="card-front">
                            <img src="{% static bread.Image %}" alt="{{ bread.Title }}" />
                            <p>{{ bread.Title }}</p>
                        </div>
                        <div class="card-back">
                            <p>{{ bread.Composition|truncatewords:20 }}</p>
                        </div>
                    </div>
                </div>
            </a>
        {% endfor %}
    </div>
{% endblock %}
