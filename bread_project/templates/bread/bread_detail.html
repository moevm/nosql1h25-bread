{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Карточка рецепта</title>
        <link rel="stylesheet" href="{% static "css/recipe.css" %}" />
    </head>
    <body class="recipe-body">
        <header class="top-bar">
            <button class="nav-btn"
                    onclick="location.href='{% url "bread:bread_list" %}'">Главная</button>
            <button class="nav-btn"
                    onclick="location.href='{% url "user_profile:show_profile" %}'">Профиль</button>
        </header>
        <main class="container">
            <section class="recipe-left">
                <div class="recipe-box">
                    <h2>Состав и рецепт</h2>
                    <p>{{ bread.Composition }}</p>
                    <p>{{ bread.Recipe }}</p>
                    <p class="created-date">Дата создания: {{ bread.Date|date:"d.m.Y" }}</p>
                </div>
                <div class="rating-label">Рейтинг: {{ bread.Rate }} / 5</div>
            </section>
            <section class="recipe-right">
                <div class="tabs">
                    <button id="tab-reviews" class="tab-btn active">Отзывы</button>
                    <button id="tab-rate" class="tab-btn">Оценить</button>
                    <button class="nav-btn"
                        onclick="location.href='{% url "bread:bread_list" %}?q={{ query }}&date-from={{ date_from }}&date-to={{ date_to }}&rating-filter={{ rating }}'">
                        Назад к списку
                    </button>
                </div>
                <div id="reviews-section" class="tab-section">
                    <div class="review">
                        <div class="review-header">
                            Иванов Иван, 52.02.2052 <span class="stars">★★★★★</span>
                        </div>
                        <div class="review-text">Очень вкусный хлеб! Рекомендую!</div>
                    </div>
                </div>
                <div id="rate-section" class="tab-section hidden">
                    <div class="star-rating" id="star-rating">
                        <span data-value="1">★</span>
                        <span data-value="2">★</span>
                        <span data-value="3">★</span>
                        <span data-value="4">★</span>
                        <span data-value="5">★</span>
                    </div>
                    <textarea id="review-text" placeholder="Введите текст отзыва"></textarea>
                    <button class="submit-btn" onclick="addReview()">Добавить отзыв</button>
                </div>
            </section>
        </main>
        <div id="notification" class="notification"></div>
        <script src="{% static "js/recipe.js" %}"></script>
    </body>
</html>
