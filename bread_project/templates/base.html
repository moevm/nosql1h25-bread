{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Хлебный сайт</title>
        <link rel="stylesheet" href="{% static "css/styles.css" %}" />
    </head>
    <body>
        <header class="top-bar">

            {% block top_bar_left %}{% endblock %}
          
            {% if user.is_authenticated %}
                <a href="{% url 'user_profile:show_profile' %}" class="profile-btn">Профиль2</a>
            {% else %}
                <a href="{% url 'user_profile:pre_registration' %}" class="profile-btn">Профиль1</a>
            {% endif %}
        </header>
        
        <main>
            {% block content %}
            {% endblock content %}
        </main>
        <script src="{% static "js/scripts.js" %}"></script>
    </body>
</html>
