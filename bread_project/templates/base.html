{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Хлебный сайт</title>
        <link rel="stylesheet" href="{% static "css/styles.css" %}" />
    </head>
    <body>
        <header class="top-bar">
            <div class="search-area">
                <input type="text" placeholder="Поиск" class="search" />
                <img src="{% static "img/filter-icon.png" %}"
                     class="filter-icon"
                     alt="фильтр"
                     onclick="toggleFilters()" />
                <div class="filter-dropdown" id="filterDropdown">
                    <label>
                        Дата от:
                        <input type="date" id="date-from" />
                    </label>
                    <label>
                        Дата до:
                        <input type="date" id="date-to" />
                    </label>
                    <label>
                        Рейтинг от:
                        <select id="rating-filter">
                            <option value="0">Любой</option>
                            <option value="1">1+</option>
                            <option value="2">2+</option>
                            <option value="3">3+</option>
                            <option value="4">4+</option>
                            <option value="5">5</option>
                        </select>
                    </label>
                </div>
            </div>
            {% if user.is_authenticated %}
                <a href="{% url 'user_profile:show_profile' %}" class="profile-btn">Профиль2</a>
            {% else %}
                <a href="{% url 'user_profile:pre_registration' %}" class="profile-btn">Профиль1</a>
            {% endif %}
        </header>
        <main>
            {% block content %}
            {% endblock content %}
        </main>
        <script src="{% static "js/scripts.js" %}"></script>
    </body>
</html>
