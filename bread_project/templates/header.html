{% load static %}

<header class="top-bar">
  {% if request.path == '/' %}
    <div class="search-area">
      <input type="text" placeholder="Поиск" class="search" />
      <img
        src="{% static 'images/filter-icon.png' %}"
        class="filter-icon"
        alt="фильтр"
        onclick="toggleFilters()"
      />
      <div class="filter-dropdown" id="filterDropdown">
        <label>Дата от: <input type="date" id="date-from" /></label>
        <label>Дата до: <input type="date" id="date-to" /></label>
        <label>
          Рейтинг от:
          <select id="rating-filter">
            <option value="0">Любой</option>
            <option value="1">1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
            <option value="4">4+</option>
            <option value="5">5</option>
          </select>
        </label>
      </div>
    </div>
    <a href="{% url 'profile' %}" class="profile-btn">Профиль</a>

  {% elif 'recipe' in request.path %}
    <button class="nav-btn" onclick="location.href='{{ '/'|add:LANGUAGE_CODE|default:'/' }}'">
      Главная
    </button>
    <a href="{% url 'profile' %}" class="nav-btn">Профиль</a>

  {% elif 'profile' in request.path %}
    <div class="top-bar-left">
      <button class="profile-btn" onclick="history.back()">Назад</button>
    </div>
    <a href="{% url 'index' %}" class="profile-btn">Главная</a>
  {% endif %}
</header>
